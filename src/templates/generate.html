<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>生成与审核 · 商品图制作</title>
  <link rel="stylesheet" href="/static/prepare.css"><link rel="stylesheet" href="/static/generate.css">
  <script src="/static/generate.js" defer></script>
</head>
<body data-session-id="{{ session_id }}">
  <header class="topbar"><a class="brand" href="/">图 · 商品图制作</a><nav aria-label="制作阶段"><a href="/prepare/{{ session_id }}">01 准备与规划</a><strong>02 生成与审核</strong></nav></header>
  <main>
    <div class="heading"><div><p class="eyebrow">GENERATE & REVIEW</p><h1>逐张生成、修改与审核</h1><p id="task-summary">正在读取已保存的计划…</p></div><div class="heading-actions"><button id="export-passed" class="primary" type="button">导出通过的图片</button><button id="export-experiment" class="secondary" type="button">导出实验包</button><a class="secondary button-link" href="/prepare/{{ session_id }}">返回准备与规划</a></div></div>
    <div id="generation-message" role="status" aria-live="polite" hidden></div>
    <p class="notice">只有点击「生成图片」或「修改图片」才调用图像服务。选择版本、Pass、导出和刷新不产生模型调用；失败不自动重试。</p>
    <p class="muted">实验包包含当前任务的资料、历史计划与已有运行证据；导出不调用 AI，也不代表图片已通过运营审核。</p>
    <div id="generation-cards" class="generation-grid"></div>
    <footer>修改保留原图与历史版本。模型未修改区域的稳定性仍需人工检查。</footer>
  </main>
</body>
</html>
