<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>生成图片 · 商品图制作</title>
  <link rel="stylesheet" href="/static/prepare.css"><link rel="stylesheet" href="/static/generate.css">
  <script src="/static/generate.js" defer></script>
</head>
<body data-session-id="{{ session_id }}">
  <header class="topbar"><span class="brand"><span class="brand-mark">图</span>商品图制作</span><nav aria-label="制作阶段"><a href="/?session={{ session_id }}">01 准备与规划</a><strong>02 生成图片</strong></nav></header>
  <main>
    <div class="heading"><div><p class="eyebrow">GENERATE</p><h1>按已确认的计划，逐张生成图片</h1><p id="task-summary">正在读取已保存的计划…</p></div><div class="heading-actions"><button id="export-experiment" class="secondary" type="button">导出实验包</button><a class="secondary button-link" href="/?session={{ session_id }}">返回准备与规划</a></div></div>
    <div id="generation-message" role="status" aria-live="polite" hidden></div>
    <p class="notice">每张图片独立生成。只有点击「生成图片」才调用图像服务并产生费用；页面切换和刷新不会自动生成或重试。</p>
    <p class="muted">实验包包含当前任务的资料、历史计划与已有运行证据；导出不调用 AI，也不代表图片已通过运营审核。</p>
    <div id="generation-cards" class="generation-grid"></div>
    <footer>当前提供图片生成。图片 Pass、AI 修改、最终导出尚未开发。</footer>
  </main>
</body>
</html>
